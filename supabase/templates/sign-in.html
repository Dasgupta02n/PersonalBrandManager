<!-- Sign-in email: paste into Supabase → Authentication → Emails → Templates, for both
     "Magic link" and "Confirm sign up". Subject: Your sign-in code -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; color: #1c1b19; font-size: 15px; line-height: 1.5;">
  <p>Your sign-in code is:</p>
  <p style="font-size: 28px; font-weight: 600; letter-spacing: 6px; margin: 16px 0;">{{ .Token }}</p>
  <p>
    Type it on the sign-in page, or
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;redirect_to={{ .RedirectTo }}">sign in with this link</a>
    on any device. Each works once and expires within an hour.
  </p>
  <p style="color: #6b6862; font-size: 13px;">If you didn't ask to sign in, ignore this email. Nobody can sign in without it.</p>
</div>
